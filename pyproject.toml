[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tripweaver"
version = "1.0.0"
description = "A provenance-aware, constraint-driven travel planning agent."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "HirasawaNiji" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "mcp>=2,<3",
  "pydantic>=2.10,<3",
  "uvicorn>=0.30,<1",
]

[project.scripts]
tripweaver = "tripweaver.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tripweaver"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
